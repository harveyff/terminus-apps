# Per-workload replica counts (keys match Deployment metadata.name and
# workloadReplicas in OlaresManifest).
#   vllmdeepseekv4flashv3 — engine Deployment (== appid / Release.Name)
#   llminit               — llm-init / entrance Deployment
workloads:
  llminit:
    replicaCount: 1
  vllmdeepseekv4flashv3:
    replicaCount: 1

# Official vllm-openai:v0.26.0-cu129 — minimal DSv4 serve flags.
engine:
  images:
    nvidia: docker.io/beclab/above-os-vllm-jasl-dsv4:sm120-20260804
    nvidiaArm64: docker.io/vllm/vllm-openai:v0.26.0-aarch64
    nvidiaGb10: docker.io/vllm/vllm-openai:v0.26.0-aarch64
  requiredGpuMemory: 180Gi
  # beclab jasl SM120 — balanced DSpark K5 + 49k ctx (JSON no spaces).
  args: '--trust-remote-code --tokenizer-mode deepseek_v4 --kv-cache-dtype fp8 --block-size 256 --tensor-parallel-size 2 --disable-custom-all-reduce --gpu-memory-utilization 0.95 --kv-cache-memory 12582912000 --max-model-len 49152 --max-num-seqs 2 --max-num-batched-tokens 8192 --enable-auto-tool-choice --tool-call-parser deepseek_v4 --reasoning-parser deepseek_v4 --speculative-config {"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}'
